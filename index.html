*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:

    radial-gradient(circle at right,#3b123e 0%,transparent 35%),

    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.container{

    max-width:1400px;
    margin:auto;
    padding:18px;
}

.header{

    justify-content:space-between;
    align-items:center;

    background:rgba(16,18,35,.92);
    border:1px solid #30334f;
    border-radius:18px;

    padding:14px 18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-circle{
    width:48px;
    height:48px;

    font-weight:900;
}

.logo-title span{
    color:#ff3fa8;
}

.subtitle{
    color:#52f2d7;
    font-size:11px;
    font-weight:bold;
    margin-top:3px;
}

.live{
    background:#ff315b;
    padding:9px 15px;
    border-radius:9px;

    font-size:12px;
    font-weight:900;

    box-shadow:0 0 20px #ff315b55;
}

}

}

    color:#ff3fa8;
